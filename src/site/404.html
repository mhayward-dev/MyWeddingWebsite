    <style>
        :root {
            --color-primary: #a67c7c;
            --color-primary-light: #c9a9a9;
            --color-text: #6b5050;
            --color-text-light: #8b7070;
            --color-background: #f8f5f2;
            --color-background-alt: #f3eeea;
            --color-cream: #faf8f5;
            --color-white: #ffffff;
            --color-shadow: rgba(107, 80, 80, 0.15);

            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-script: 'Dancing Script', cursive;
            --font-sans: 'Lato', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font-sans);
            background:
                linear-gradient(135deg, rgba(248, 245, 242, 0.95) 0%, rgba(250, 248, 245, 0.9) 100%),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f5f0eb" width="100" height="100"/></svg>');

            color: var(--color-text);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
            background: var(--color-white);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--color-shadow);
        }

        .image-container {
            margin-bottom: 30px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px var(--color-shadow);
        }

        h1 {
            font-family: var(--font-script);
            font-size: 3rem;
            color: var(--color-primary);
            margin-bottom: 20px;
            font-weight: 500;
        }

        p {
            font-size: 1.2rem;
            color: var(--color-text-light);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--color-primary);
            color: var(--color-white);
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--color-shadow);
        }

        .btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--color-shadow);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }
        }
