<!-- بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ - Bismillah hir Rahman nir Raheem -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cansu & Mark ♥ Civil Ceremony</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cansuandmark.com/login">
    <meta property="og:title" content="Cansu & Mark ♥ Invitation">
    <meta property="og:description" content="Join our celebration! 🎉 Feiert mit uns! 🎊 Birlikte kutlayalım!">
    <meta property="og:image" content="https://cansuandmark.com/images/w8zq5r3k_og.jpg">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="400">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="de_DE">
    <meta property="og:locale:alternate" content="tr_TR">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://cansuandmark.com/login">
    <meta name="twitter:title" content="Cansu & Mark ♥ Invitation">
    <meta name="twitter:description" content="Join our celebration! 🎉 Feiert mit uns! 🎊 Birlikte kutlayalım!">
    <meta name="twitter:image" content="https://cansuandmark.com/images/w8zq5r3k_og.jpg">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="auth-container">
        <div class="auth-modal">
            <!-- Language Selector -->
            <div class="language-bar">
                <button class="lang-btn" data-lang="en" title="English">
                    <img class="flag-icon" src="images/flag-uk-heart.svg" alt="English" width="36" height="36">
                </button>
                <button class="lang-btn" data-lang="de" title="Deutsch">
                    <img class="flag-icon" src="images/flag-de-heart.svg" alt="Deutsch" width="36" height="36">
                </button>
                <button class="lang-btn" data-lang="tr" title="Türkçe">
                    <img class="flag-icon" src="images/flag-tr-heart.svg" alt="Türkçe" width="36" height="36">
                </button>
            </div>

            <h2 class="auth-title" data-i18n="authTitle">Cansu & Mark</h2>
            <h3 class="auth-invitation" data-i18n="authInvitation">Invitation to Our Civil Ceremony</h3>
            <p class="auth-subtitle" data-i18n="authSubtitle">Please enter the code to view this page</p>
            <form id="authForm" class="auth-form" novalidate>
                <input type="text" id="authPassword" class="fake-password" data-i18n-placeholder="codePlaceholder" placeholder="Enter code" autocomplete="off" data-lpignore="true" data-form-type="other" readonly onfocus="this.removeAttribute('readonly');" required>
                <button type="submit" data-i18n="enterButton">Enter</button>
            </form>
            <p id="authError" class="auth-error" style="display: none;" data-i18n="authError">Incorrect password</p>
        </div>
    </div>

    <script src="js/i18n.js"></script>

    <script>
        const Auth = {
            TOKEN_KEY: 'wedding_auth_token',
            EXPIRY_KEY: 'wedding_auth_expiry',

            isAuthenticated() {
                const token = localStorage.getItem(this.TOKEN_KEY);
                const expiry = localStorage.getItem(this.EXPIRY_KEY);
                
                if (!token || !expiry) return false;
                
                // Check if token has expired
                if (Date.now() > parseInt(expiry, 10)) {
                    this.clearAuth();
                    return false;
                }
                
                return true;
            },

            setAuth(token, expiresAt) {
                localStorage.setItem(this.TOKEN_KEY, token);
                localStorage.setItem(this.EXPIRY_KEY, expiresAt.toString());
            },

            clearAuth() {
                localStorage.removeItem(this.TOKEN_KEY);
                localStorage.removeItem(this.EXPIRY_KEY);
            },

            getRedirectUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('redirect') || '/';
            },

            async verifyPassword(password) {
                try {
                    const response = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        this.setAuth(data.token, data.expiresAt);
                        return { success: true };
                    } else {
                        return { success: false, error: data.error || 'Invalid password' };
                    }
                } catch (error) {
                    console.error('Auth error:', error);
                    return { success: false, error: 'Connection error. Please try again.' };
                }
            },

            init() {
                // If already authenticated, redirect immediately
                if (this.isAuthenticated()) {
                    window.location.replace(this.getRedirectUrl());
                    return;
                }

                const form = document.getElementById('authForm');
                const input = document.getElementById('authPassword');
                const errorEl = document.getElementById('authError');

                // Hide error when user starts typing
                input.addEventListener('input', () => {
                    if (errorEl.style.display === 'block') {
                        errorEl.style.display = 'none';
                    }
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const password = input.value.trim();
                    if (!password) {
                        const lang = i18n.getCurrentLanguage();
                        const translations = loginTranslations[lang];
                        errorEl.textContent = translations.authError;
                        errorEl.style.display = 'block';
                        input.focus();
                        return;
                    }
                    
                    const submitBtn = form.querySelector('button[type="submit"]');
                    const originalText = submitBtn.textContent;
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
                    errorEl.style.display = 'none';
                    
                    const result = await this.verifyPassword(password);
                    
                    if (result.success) {
                        window.location.replace(this.getRedirectUrl());
                    } else {
                        // Get current language and appropriate error message
                        const lang = i18n.getCurrentLanguage();
                        const translations = loginTranslations[lang];
                        
                        // Determine which error message to show
                        let errorMessage;
                        if (result.error.includes('Connection error') || result.error.includes('Connection')) {
                            errorMessage = translations.connectionError;
                        } else {
                            errorMessage = translations.authError;
                        }
                        
                        errorEl.textContent = errorMessage;
                        errorEl.style.display = 'block';
                        input.value = '';
                        input.focus();
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                    }
                });
            }
        };

        // Login page translations
        const loginTranslations = {
            en: {
                pageTitle: "Login - Cansu & Mark ♥ Civil Ceremony",
                authTitle: "Cansu & Mark",
                authInvitation: "Invitation to Our Civil Ceremony",
                authSubtitle: 'Please enter the code to view this page',
                codePlaceholder: 'Enter code',
                enterButton: 'Enter',
                authError: 'Incorrect password',
                connectionError: 'Connection error. Please try again.'
            },
            de: {
                pageTitle: 'Login - Cansu & Mark ♥ Standesamtliche Trauung',
                authTitle: 'Cansu & Mark',
                authInvitation: 'Einladung zum Standesamt',
                authSubtitle: 'Zum Öffnen dieser Seite bitte den Code eingeben.',
                codePlaceholder: 'Code eingeben',
                enterButton: 'Eintreten',
                authError: 'Falsches Passwort',
                connectionError: 'Verbindungsfehler. Bitte versuche es erneut.'
            },
            tr: {
                pageTitle: "Giriş - Cansu & Mark ♥ Nikah",
                authTitle: "Cansu & Mark",
                authInvitation: 'Nikâh Daveti',
                authSubtitle: 'Sayfayı görüntülemek için şifreyi girin.',
                codePlaceholder: 'Kodu girin',
                enterButton: 'Giriş',
                authError: 'Yanlış şifre',
                connectionError: 'Bağlantı hatası. Lütfen tekrar deneyin.'
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            i18n.init(loginTranslations);
            Auth.init();
        });
    </script>
</body>
</html>
