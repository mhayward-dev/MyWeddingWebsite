<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <clipPath id="heart-uk">
      <path d="M50 90 C20 60, 0 40, 0 25 C0 10, 15 0, 30 0 C40 0, 50 10, 50 20 C50 10, 60 0, 70 0 C85 0, 100 10, 100 25 C100 40, 80 60, 50 90 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#heart-uk)">
    <!-- Blue background -->
    <rect width="100" height="100" fill="#00247d"/>
    <!-- White diagonal stripes -->
    <path d="M0,-10 L100,90 M100,-10 L0,90" stroke="#fff" stroke-width="15"/>
    <!-- Red diagonal stripes (clipped) -->
    <path d="M0,-10 L50,40 L0,90" fill="none" stroke="#cf142b" stroke-width="7"/>
    <path d="M100,-10 L50,40 L100,90" fill="none" stroke="#cf142b" stroke-width="7"/>
    <!-- White cross -->
    <path d="M50,-10 v100 M0,40 h100" stroke="#fff" stroke-width="20"/>
    <!-- Red cross -->
    <path d="M50,-10 v100 M0,40 h100" stroke="#cf142b" stroke-width="12"/>
  </g>
</svg>
